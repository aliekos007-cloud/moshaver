{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود — طبیب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Vazirmatn, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e40af 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            margin: 0; padding: 1rem; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.3), transparent 70%);
            top: -200px; right: -200px; border-radius: 50%;
        }
        body::after {
            content: ''; position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2), transparent 70%);
            bottom: -150px; left: -150px; border-radius: 50%;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px; padding: 2.5rem;
            width: 100%; max-width: 420px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative; z-index: 1;
            animation: slideUp .5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: white; margin: 0 auto 1.25rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }
        .login-title { text-align: center; color: #0f172a; font-weight: 700; font-size: 1.5rem; margin-bottom: .35rem; }
        .login-sub { text-align: center; color: #64748b; font-size: .85rem; margin-bottom: 2rem; }
        .form-label { font-weight: 600; font-size: .82rem; color: #0f172a; margin-bottom: .4rem; }
        .form-control {
            border-radius: 12px; border: 1.5px solid #e2e8f0;
            padding: .75rem 1rem; font-size: .9rem;
            background: #f8fafc; transition: all .2s;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #fff;
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white; border: none; border-radius: 12px;
            padding: .75rem; font-size: .95rem; font-weight: 600;
            width: 100%; margin-top: .5rem;
            transition: all .2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
            color: white;
        }
        .error-box {
            background: #fee2e2; color: #991b1b;
            padding: .75rem 1rem; border-radius: 12px;
            font-size: .83rem; margin-bottom: 1rem;
            border-right: 4px solid #ef4444;
        }
        .footer-text { text-align: center; color: #94a3b8; font-size: .75rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-icon"><i class="bi bi-heart-pulse-fill"></i></div>
    <div class="login-title">سامانه جامع طبیب</div>
    <div class="login-sub">برای ورود، کد ملی و رمز عبور خود را وارد کنید</div>

    {% if form.errors %}
        <div class="error-box">
            <i class="bi bi-exclamation-triangle-fill"></i>
            کد ملی یا رمز عبور اشتباه است.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">کد ملی</label>
            <input type="text" name="username" class="form-control" required autofocus
                   placeholder="۱۰ رقم بدون خط تیره" maxlength="10">
        </div>
        <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input type="password" name="password" class="form-control" required
                   placeholder="••••••••">
        </div>
        <button class="btn-login">
            <i class="bi bi-box-arrow-in-left"></i> ورود به سامانه
        </button>
    </form>

    <div class="footer-text">© ۱۴۰۴ — نسخه ۱.۰</div>
</div>
</body>
</html>
